name: Build e testes
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: Testes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore CentralChamados.slnx
      - run: dotnet build CentralChamados.slnx --configuration Release --no-restore
      - run: dotnet test CentralChamados.slnx --configuration Release --no-build
